<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Transcript QA</title>
        <style>
            :root {
                --fg: #1a1a1a;
                --muted: #666;
                --line: #e2e2e2;
                --accent: #2b6cb0;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                max-width: 760px;
                margin: 0 auto;
                padding: 2rem 1.25rem;
                color: var(--fg);
                line-height: 1.5;
            }
            h1 {
                font-size: 1.4rem;
                margin: 0 0 0.25rem;
            }
            p.sub {
                color: var(--muted);
                margin: 0 0 1.5rem;
                font-size: 0.9rem;
            }
            form {
                display: flex;
                gap: 0.5rem;
            }
            input[type="text"] {
                flex: 1;
                padding: 0.65rem 0.75rem;
                font-size: 1rem;
                border: 1px solid var(--line);
                border-radius: 6px;
            }
            button {
                padding: 0.65rem 1.1rem;
                font-size: 1rem;
                border: none;
                border-radius: 6px;
                background: var(--accent);
                color: #fff;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            #status {
                color: var(--muted);
                font-size: 0.9rem;
                margin: 1rem 0 0;
                min-height: 1.2em;
            }
            #answer {
                margin-top: 1.25rem;
                white-space: pre-wrap;
            }
            #sources {
                margin-top: 1.5rem;
            }
            #sources h2 {
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--muted);
            }
            .source {
                border-left: 3px solid var(--line);
                padding: 0.4rem 0 0.4rem 0.75rem;
                margin: 0.6rem 0;
                font-size: 0.92rem;
            }
            .source .meta {
                color: var(--muted);
                font-size: 0.8rem;
            }
            .ts {
                color: var(--accent);
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <h1>Transcript QA</h1>
        <p class="sub">
            Ask a question about the documentary. Answers are grounded in the
            transcript with timestamped sources.
        </p>

        <form id="ask-form">
            <input
                type="text"
                id="question"
                placeholder="e.g. What was added to bread to whiten it?"
                autocomplete="off"
                required
            />
            <button type="submit" id="submit-btn">Ask</button>
        </form>

        <p id="status"></p>
        <div id="answer"></div>
        <div id="sources"></div>

        <script>
            const form = document.getElementById("ask-form");
            const input = document.getElementById("question");
            const btn = document.getElementById("submit-btn");
            const statusEl = document.getElementById("status");
            const answerEl = document.getElementById("answer");
            const sourcesEl = document.getElementById("sources");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const question = input.value.trim();
                if (!question) return;

                btn.disabled = true;
                answerEl.textContent = "";
                sourcesEl.innerHTML = "";
                statusEl.textContent = "Thinking…";

                try {
                    const res = await fetch("/ask", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ question }),
                    });
                    if (!res.ok) {
                        const detail = await res.json().catch(() => ({}));
                        throw new Error(
                            detail.detail || `Request failed (${res.status})`,
                        );
                    }
                    const data = await res.json();
                    render(data);
                } catch (err) {
                    statusEl.textContent = "";
                    answerEl.textContent = `Error: ${err.message}`;
                } finally {
                    btn.disabled = false;
                }
            });

            function render(data) {
                const t = data.timings || {};
                statusEl.textContent =
                    t.total_ms != null
                        ? `Answered in ${(t.total_ms / 1000).toFixed(1)}s`
                        : "";
                answerEl.textContent = data.answer || "";

                const sources = data.sources || [];
                if (sources.length === 0) return;

                const h = document.createElement("h2");
                h.textContent = "Sources";
                sourcesEl.appendChild(h);

                for (const s of sources) {
                    const div = document.createElement("div");
                    div.className = "source";
                    const meta = document.createElement("div");
                    meta.className = "meta";
                    meta.innerHTML = `<span class="ts">${s.timestamp}</span> · score ${s.score}`;
                    const excerpt = document.createElement("div");
                    excerpt.textContent = s.excerpt;
                    div.appendChild(meta);
                    div.appendChild(excerpt);
                    sourcesEl.appendChild(div);
                }
            }
        </script>
    </body>
</html>
