services:
  app:
    build: .
    container_name: transcript-qa-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # localhost in .env resolves to the container itself; reach the host's Ollama instead
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
